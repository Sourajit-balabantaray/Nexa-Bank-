{% extends 'base.html' %}
{% block title %}Upload too large{% endblock %}
{% block content %}
<section class="card">
  <div class="card-body empty-state">
    <div class="empty-icon"><i class="fa-solid fa-file-circle-exclamation" aria-hidden="true"></i></div>
    <h1>Upload is too large</h1>
    <p class="text-muted">The total request exceeds the allowed upload size. Each document must be 5 MB or smaller.</p>
    <a class="btn btn-primary" href="{{ url_for('auth.register') }}">Return to registration</a>
  </div>
</section>
{% endblock %}
