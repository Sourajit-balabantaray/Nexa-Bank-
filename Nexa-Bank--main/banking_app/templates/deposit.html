{% extends 'base.html' %}
{% block title %}Deposit{% endblock %}
{% block page_title %}Deposit{% endblock %}
{% block content %}
<div class="page-heading"><h1>Deposit funds</h1><p class="text-muted">Current balance: ₹{{ "{:,.2f}".format(account.balance) }}. Simulation only; no real money is moved.</p></div>
<section class="card tw-card narrow-form-card"><div class="card-body"><form method="post" action="{{ url_for('transactions.deposit') }}" data-confirm="Confirm this deposit of the selected amount?">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label class="form-label" for="amount">Amount (₹)</label><input class="form-control" id="amount" name="amount" type="number" min="0.01" max="10000000" step="0.01" required></div>
  <div class="form-group"><label class="form-label" for="deposit_method">Deposit method</label><select class="form-control" id="deposit_method" name="deposit_method"><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="cheque">Cheque</option></select></div>
  <div class="form-group"><label class="form-label" for="description">Description</label><input class="form-control" id="description" name="description" maxlength="255"></div>
  <button class="btn btn-primary" type="submit">Deposit funds</button>
</form></div></section>
{% endblock %}
