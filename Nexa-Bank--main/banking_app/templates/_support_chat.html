<section class="support-chat" id="supportChat" aria-label="NexaBank support chat" data-knowledge-url="{{ url_for('static', filename='knowledge/nexabank-help.md') }}">
  <button class="support-chat-launcher" id="supportChatLauncher" type="button" aria-expanded="false" aria-controls="supportChatPanel" aria-label="Open help chat">
    <i class="fa-regular fa-comments" aria-hidden="true"></i>
    <span>Help</span>
  </button>
  <div class="support-chat-panel" id="supportChatPanel" role="dialog" aria-labelledby="supportChatTitle" aria-hidden="true">
    <header class="support-chat-header">
      <span class="support-chat-avatar"><i class="fa-solid fa-landmark" aria-hidden="true"></i></span>
      <div><h2 id="supportChatTitle">NexaBank help</h2><p id="supportChatStatus" role="status">Loading local help guide…</p></div>
      <button class="support-chat-close" id="supportChatClose" type="button" aria-label="Close help chat"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </header>
    <div class="support-chat-messages" id="supportChatMessages" role="log" aria-live="polite" aria-relevant="additions">
      <div class="support-chat-message bot">Hi! Ask a question and I’ll search NexaBank’s local help content for a relevant answer.</div>
      <div class="support-chat-suggestions" aria-label="Suggested questions">
        <button type="button" data-chat-question="How do I transfer money?">Transfer money</button>
        <button type="button" data-chat-question="Where can I see transactions?">Transactions</button>
        <button type="button" data-chat-question="How do I change my password?">Account security</button>
      </div>
    </div>
    <form class="support-chat-form" id="supportChatForm">
      <label class="sr-only" for="supportChatInput">Ask a question</label>
      <input id="supportChatInput" name="question" type="text" maxlength="240" placeholder="Search the help guide…" autocomplete="off" required>
      <button type="submit" aria-label="Send question"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
    </form>
    <p class="support-chat-note">Never share passwords, PINs, or identity numbers here.</p>
  </div>
</section>
